<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Anuj Tripathi - AnujOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a84ff'/%3E%3Cpath fill='white' d='M16 6.5 23.5 24h-3.2l-1.3-3.2h-6L11.7 24H8.5L16 6.5zm0 6.4-1.8 4.6h3.6L16 12.9z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="boot">
  <div class="boot-logo" aria-hidden="true">
    <svg class="mark" viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path fill="currentColor" d="M16 7.2 23.2 24h-3.1l-1.3-3.1h-5.6L12 24H8.8L16 7.2zm0 6.1-1.7 4.4h3.4L16 13.3z"/></svg>
  </div>
  <div class="boot-bar"><div class="boot-fill"></div></div>
  <div class="boot-text">Starting AnujOS</div>
  <div class="boot-skip">Click to skip</div>
</div>

<header id="menubar" class="hidden">
  <div class="mb-left">
    <button type="button" class="mb-apple" id="mb-apple" aria-label="AnujOS menu">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="currentColor" d="M16 7.2 23.2 24h-3.1l-1.3-3.1h-5.6L12 24H8.8L16 7.2zm0 6.1-1.7 4.4h3.4L16 13.3z"/></svg>
    </button>
    <span class="mb-app" id="mb-app-name">Finder</span>
    <button type="button" class="mb-item" data-menu="file">File</button>
    <button type="button" class="mb-item" data-menu="edit">Edit</button>
    <button type="button" class="mb-item" data-menu="view">View</button>
    <button type="button" class="mb-item" data-menu="window">Window</button>
    <button type="button" class="mb-item" data-menu="help">Help</button>
  </div>
  <div class="mb-right">
    <span id="mb-focus" hidden>Focus</span>
    <button type="button" class="mb-btn" id="mb-search" aria-label="Spotlight">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 10.2 13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="mb-btn" id="mb-cc" aria-label="Control Center">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 4.5h12M2 8h12M2 11.5h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="5.5" cy="4.5" r="1.5" fill="currentColor"/><circle cx="11" cy="8" r="1.5" fill="currentColor"/><circle cx="7" cy="11.5" r="1.5" fill="currentColor"/></svg>
    </button>
    <time id="mb-clock"></time>
  </div>
</header>

<main id="desktop" class="hidden">
  <div id="wallpaper" class="theme-aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="grain"></span>
    <span class="vignette"></span>
  </div>
  <section id="widget" aria-label="Clock">
    <div id="w-time">--:--</div>
    <div id="w-date"></div>
    <div id="w-greet"></div>
  </section>
  <div id="desktop-icons"></div>
  <div id="windows"></div>
</main>

<footer id="dock" class="hidden">
  <div id="dock-apps"></div>
</footer>

<template id="window-template">
  <section class="window">
    <div class="titlebar">
      <div class="traffic">
        <button type="button" class="tl close" title="Close" aria-label="Close"><span>×</span></button>
        <button type="button" class="tl minimize" title="Minimize" aria-label="Minimize"><span>-</span></button>
        <button type="button" class="tl maximize" title="Fill screen" aria-label="Fill screen"><span>+</span></button>
      </div>
      <div class="window-title"></div>
      <div class="titlebar-spacer"></div>
    </div>
    <div class="window-body"></div>
    <div class="resize-handle" title="Resize"></div>
  </section>
</template>

<div id="flyout" class="menu-pop hidden" role="menu"></div>

<aside id="cc" class="hidden" aria-label="Control Center">
  <div class="cc-grid">
    <button type="button" class="cc-tile on" id="cc-wifi">
      <span class="cc-name">Wi-Fi</span>
      <small id="cc-wifi-label">On</small>
    </button>
    <button type="button" class="cc-tile" id="cc-focus">
      <span class="cc-name">Focus</span>
      <small id="cc-focus-label">Off</small>
    </button>
  </div>
  <label class="cc-slider">Display
    <input id="cc-bright" type="range" min="0.6" max="1.15" step="0.01" value="1" aria-label="Display brightness">
  </label>
  <div class="cc-label">Wallpaper</div>
  <div class="cc-themes" role="group" aria-label="Wallpaper">
    <button type="button" class="swatch on" data-theme="aurora" aria-label="Aurora"></button>
    <button type="button" class="swatch" data-theme="dusk" aria-label="Dusk"></button>
    <button type="button" class="swatch" data-theme="ocean" aria-label="Ocean"></button>
  </div>
  <p class="cc-note">Power source is this browser tab.</p>
</aside>

<div id="spot-back" class="hidden">
  <form id="spotlight" role="dialog" aria-label="Spotlight">
    <div id="spot-field">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 10.2 13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="spot-in" placeholder="Spotlight Search" autocomplete="off" spellcheck="false" aria-label="Spotlight Search">
    </div>
    <div id="spot-results"></div>
  </form>
</div>

<div id="sleep" class="hidden" role="button" tabindex="0" aria-label="Wake AnujOS">
  <div id="sleep-time">--:--</div>
  <div id="sleep-date"></div>
  <div class="sleep-hint">Click or press any key to wake</div>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
